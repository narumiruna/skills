# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "end-of-file-fixer" },
  {
    id = "mixed-line-ending",
    args = ["--fix=lf"]
  },
  { id = "trailing-whitespace" }
]

[[repos]]
repo = "https://github.com/simple-icons/svglint"
rev = "v4.2.1"
hooks = [
  { id = "svglint" }
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.21"
hooks = [
  {
    id = "ruff",
    args = ["--fix"]
  },
  { id = "ruff-format" }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "skills-update",
    name = "update project skills",
    entry = "npx skills update --project",
    language = "system",
    pass_filenames = false,
    always_run = true
  },
  {
    id = "lint-python-scripts",
    name = "check Python script metadata and executable headers",
    entry = "uv run scripts/lint_python_scripts.py",
    language = "system",
    files = "\\.py$"
  },
  {
    id = "normalize-skill-paths",
    name = "normalize skill paths",
    entry = "uv run --no-project scripts/normalize_skill_paths.py",
    language = "system",
    files = "^(global|optional)/skills/",
    types = ["text"]
  }
]
