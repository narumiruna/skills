<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UI Style Interview</title>
  <script defer src="/viewer.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      font: 1rem/1.5 system-ui, sans-serif;
    }

    body {
      background: Canvas;
      color: CanvasText;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      margin: 0;
      min-block-size: 100vh;
      min-block-size: 100dvh;
    }

    header {
      border-block-end: 1px solid GrayText;
      padding: 0.75rem clamp(1rem, 3vw, 2rem);
    }

    h1 {
      font-size: 1.125rem;
      margin: 0;
    }

    #status {
      margin-block: 0.35rem 0;
    }

    fieldset {
      align-items: center;
      border: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 1rem;
      margin: 0.35rem 0 0;
      padding: 0;
    }

    label,
    button {
      align-items: center;
      display: inline-flex;
      font: inherit;
      min-block-size: 2.75rem;
    }

    label {
      gap: 0.25rem;
      min-inline-size: 2.75rem;
    }

    #preview {
      min-block-size: 0;
    }

    iframe {
      block-size: 100%;
      border: 0;
      display: block;
      inline-size: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>UI Style Interview</h1>
    <p id="status" role="status">Waiting for the first preview.</p>
    <form id="answer" hidden>
      <fieldset disabled>
        <legend>Compare the options below, then choose A, B, or C.</legend>
        <label><input type="radio" name="choice" value="A" required> A</label>
        <label><input type="radio" name="choice" value="B" required> B</label>
        <label><input type="radio" name="choice" value="C" required> C</label>
        <button type="submit">Submit answer</button>
      </fieldset>
    </form>
    <noscript>Enable JavaScript, or open the preview link from Pi and answer there.</noscript>
  </header>
  <main id="preview"></main>
</body>
</html>
